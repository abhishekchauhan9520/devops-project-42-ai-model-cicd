name: MLOps CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python ml/train.py
      - run: python ml/evaluate.py --model-path artifacts/model.joblib
      - uses: actions/upload-artifact@v7
        with:
          name: trained-model
          path: artifacts/

  registry-validation:
    runs-on: ubuntu-latest
    needs: quality-gate
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mlflow
          POSTGRES_PASSWORD: mlflow
          POSTGRES_DB: mlflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mlflow -d mlflow"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: trained-model
          path: artifacts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: |
          mlflow server --host 127.0.0.1 --port 5000 \
            --backend-store-uri postgresql://mlflow:mlflow@127.0.0.1:5432/mlflow \
            --artifacts-destination ./mlartifacts > /tmp/mlflow.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:5000/version && break; sleep 2; done
          curl -fsS http://127.0.0.1:5000/version
      - env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: python ml/register.py

  promote-candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: registry-validation
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - run: |
          grep -q 'candidate' ml/promotion.py
          grep -q 'CONFIRM_PROMOTION' ml/promotion.py

  production-promotion:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    needs: registry-validation
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Require explicit production confirmation
        env:
          CONFIRM_PROMOTION: ${{ secrets.CONFIRM_PROMOTION }}
        run: test "$CONFIRM_PROMOTION" = "PROMOTE-CHAMPION"
